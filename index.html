<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>系统升级维护中</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 45%, #2a2a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .maintenance-container {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(16px) saturate(200%);
            -webkit-backdrop-filter: blur(16px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .maintenance-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff8c3c, #ffb86c, #ff8c3c);
            animation: borderGlow 2s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .icon-wrapper {
            display: inline-block;
            width: 90px;
            height: 90px;
            line-height: 90px;
            background: rgba(255, 140, 60, 0.15);
            border-radius: 50%;
            margin-bottom: 20px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .icon-wrapper i {
            font-size: 3.5rem;
            color: #ffb86c;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 140, 60, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 140, 60, 0.2); }
        }

        .maintenance-title {
            color: #f0f0f0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .maintenance-subtitle {
            color: rgba(220, 230, 240, 0.5);
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            letter-spacing: 2px;
        }

        .maintenance-description {
            color: rgba(220, 230, 240, 0.7);
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .maintenance-description .highlight {
            color: #ffb86c;
            font-weight: 500;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .time-box .label {
            color: rgba(220, 230, 240, 0.4);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .time-box .target-time {
            color: #ffb86c;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .countdown-wrapper {
            margin: 1.5rem 0;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 65px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .countdown-item .number {
            color: #f0f0f0;
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: block;
            line-height: 1.2;
        }

        .countdown-item .unit {
            color: rgba(220, 230, 240, 0.35);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .progress-container {
            margin-top: 1.8rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            color: rgba(220, 230, 240, 0.4);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8c3c, #ffb86c);
            border-radius: 3px;
            transition: width 1s ease;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .maintenance-footer {
            margin-top: 2rem;
            color: rgba(220, 230, 240, 0.25);
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .maintenance-footer i {
            margin: 0 4px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 140, 60, 0.15);
            color: #ffb86c;
            font-size: 0.7rem;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 140, 60, 0.2);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* 闪烁小点 */
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff8c3c;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
            margin-right: 6px;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 2rem 1.5rem;
            }
            .maintenance-title {
                font-size: 1.4rem;
            }
            .countdown-item {
                min-width: 50px;
                padding: 10px 12px;
            }
            .countdown-item .number {
                font-size: 1.5rem;
            }
            .icon-wrapper {
                width: 70px;
                height: 70px;
                line-height: 70px;
            }
            .icon-wrapper i {
                font-size: 2.5rem;
            }
            .time-box .target-time {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .maintenance-container {
                padding: 1.5rem 1rem;
            }
            .countdown-display {
                gap: 8px;
            }
            .countdown-item {
                min-width: 42px;
                padding: 8px 6px;
            }
            .countdown-item .number {
                font-size: 1.2rem;
            }
            .maintenance-description {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">

        <!-- 图标 -->
        <div class="icon-wrapper">
            <i class="fas fa-rocket"></i>
        </div>

        <!-- 标题 -->
        <h1 class="maintenance-title">系统升级维护中</h1>
        <p class="maintenance-subtitle">🚧 我们正在努力优化您的体验</p>

        <!-- 状态标识 -->
        <div class="status-badge">
            <span class="live-dot"></span> 维护进行中
        </div>

        <!-- 描述 -->
        <p class="maintenance-description" style="margin-top: 18px;">
            服务器正在进行 <span class="highlight">系统升级与性能优化</span>，
            预计于以下时间完成恢复。感谢您的耐心等待！
        </p>

        <!-- 目标时间 -->
        <div class="time-box">
            <div class="label"><i class="far fa-calendar-alt"></i> 预计恢复时间</div>
            <div class="target-time">2026年7月10日 12:00</div>
        </div>

        <!-- 倒计时 -->
        <div class="countdown-wrapper">
            <div class="countdown-display" id="countdownDisplay">
                <div class="countdown-item">
                    <span class="number" id="days">00</span>
                    <span class="unit">天</span>
                </div>
                <div class="countdown-item">
                    <span class="number" id="hours">00</span>
                    <span class="unit">时</span>
                </div>
                <div class="countdown-item">
                    <span class="number" id="minutes">00</span>
                    <span class="unit">分</span>
                </div>
                <div class="countdown-item">
                    <span class="number" id="seconds">00</span>
                    <span class="unit">秒</span>
                </div>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-label">
                <span>升级进度</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="maintenance-footer">
            <i class="fas fa-shield-alt"></i>
            YDM 技术团队 · 为您提供更好的服务
        </div>

    </div>

    <script>
        (function() {
            const targetDate = new Date('2026-07-10T12:00:00');

            function padZero(num) {
                return String(num).padStart(2, '0');
            }

            function updateMaintenance() {
                const now = new Date();
                const diff = targetDate.getTime() - now.getTime();

                // 如果已过目标时间，显示全0
                if (diff <= 0) {
                    document.getElementById('days').textContent = '00';
                    document.getElementById('hours').textContent = '00';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    document.getElementById('progressFill').style.width = '100%';
                    document.getElementById('progressText').textContent = '100%';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = padZero(days);
                document.getElementById('hours').textContent = padZero(hours);
                document.getElementById('minutes').textContent = padZero(minutes);
                document.getElementById('seconds').textContent = padZero(seconds);

                // 计算进度（从 2026-07-06 00:00 开始到目标时间）
                const startDate = new Date('2026-07-06T00:00:00');
                const totalDuration = targetDate.getTime() - startDate.getTime();
                const elapsed = now.getTime() - startDate.getTime();
                let progress = (elapsed / totalDuration) * 100;
                progress = Math.max(0, Math.min(100, progress));

                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent = Math.round(progress) + '%';
            }

            updateMaintenance();
            setInterval(updateMaintenance, 1000);
        })();
    </script>

</body>
</html>
